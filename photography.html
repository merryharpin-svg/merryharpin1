  <link rel="stylesheet" href="styles.css">
  <style>
    /* Photography gallery — masonry columns preserve full, uncropped images */
    .photo-grid { column-count: 3; column-gap: 18px; }
    .photo-grid .photo-item {
      break-inside: avoid; margin: 0 0 18px; padding: 0; border: none; background: none;
      cursor: zoom-in; position: relative; overflow: hidden;
    }
    .photo-grid .photo-item img {
      width: 100%; display: block; border-radius: 2px;
      transition: transform .5s ease, filter .5s ease; filter: saturate(.98);
    }
    .photo-grid .photo-item:hover img { transform: scale(1.02); filter: saturate(1.06); }
    @media (max-width: 900px) { .photo-grid { column-count: 2; } }
    @media (max-width: 560px) { .photo-grid { column-count: 1; } }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(10,10,10,.92);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: opacity .3s ease; z-index: 1000;
      padding: 32px; cursor: zoom-out;
    }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lightbox img { max-width: 100%; max-height: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    .lightbox-close {
      position: absolute; top: 22px; right: 28px; color: #f7f7f7;
      font-family: 'Outfit', sans-serif; font-size: 2rem; line-height: 1;
      background: none; border: none; cursor: pointer; opacity: .8;
    }
    .lightbox-close:hover { opacity: 1; }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">Merry Harpin</a>
      <ul class="nav-links">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#work">Work</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li class="has-dropdown">
          <button class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">Shop</button>
          <div class="dropdown-menu">
            <a href="shop.html">Original Drawings</a>
            <a href="calendar.html">Bird Calendar 2027–2028</a>
          </div>
        </li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <button class="menu-toggle" aria-label="Toggle menu">
        <span></span>

  <!-- Photography -->
  <section class="section work" style="padding-top: 140px;">
    <div class="container">
      <div class="section-header">
        <span class="section-number">04</span>
        <h2>Photography</h2>
      </div>
      <div class="photo-grid" id="photoGrid">
        <div class="photo-item"><img src="images/IMG_1150.JPG" alt="Photograph by Merry Harpin"></div>
        <div class="photo-item"><img src="images/IMG_1154.JPG" alt="Photograph by Merry Harpin"></div>
        <div class="photo-item"><img src="images/IMG_1161_2.JPG" alt="Photograph by Merry Harpin"></div>
        <div class="photo-item"><img src="images/IMG_1103.JPG" alt="Tufted titmouse perched on a branch"></div>
        <div class="photo-item"><img src="images/IMG_0993.JPG" alt="Bird perched against a cloudy sky"></div>
        <div class="photo-item"><img src="images/IMG_1024.JPG" alt="Bird among lily pads on a pond"></div>
        <div class="photo-item"><img src="images/IMG_0987.JPG" alt="Bird in flight against the clouds"></div>
        <div class="photo-item"><img src="images/IMG_1225.JPG" alt="Merry Harpin drawing"></div>
        <div class="photo-item"><img src="images/IMG_0909.JPG" alt="Hummingbird feeding at an iris"></div>
        <div class="photo-item"><img src="images/IMG_0911.JPG" alt="Hummingbird feeding at agapanthus blooms"></div>
        <div class="photo-item"><img src="images/IMG_0898.JPG" alt="Hummingbird in a tree against blue sky"></div>
        <div class="photo-item"><img src="images/IMG_0918.JPG" alt="Hummingbird perched on a branch against blue sky"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 Merry Harpin. All rights reserved.</p>
      <p class="footer-note">A pupil of Beauty</p>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <img src="" alt="">
  </div>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => {
      navLinks.classList.toggle('open');
      toggle.classList.toggle('active');
    });

    const dropdown = document.querySelector('.has-dropdown');
    const dropdownToggle = document.querySelector('.dropdown-toggle');
    if (dropdownToggle) {
      dropdownToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
        dropdownToggle.setAttribute('aria-expanded', dropdown.classList.contains('open'));
      });
      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
          dropdownToggle.setAttribute('aria-expanded', 'false');
        }
      });
    }

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('open');
        toggle.classList.remove('active');
      });
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    document.getElementById('photoGrid').addEventListener('click', (e) => {
      const img = e.target.closest('.photo-item img');
      if (!img) return;
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
    });
    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') lightbox.classList.remove('open');
    });
  </script>
</body>
